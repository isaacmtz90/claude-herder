# Claude Herder configuration.
# Everything version-coupled lives here, so a change to Claude Code's prompt UI
# is a config edit rather than a code change.

[permissions]
# What to send to Claude Code's permission menu.
#
# Answers are given by moving the dialog's own cursor with arrow keys and
# confirming with Enter, NOT by typing an option number: a family of dialogs
# renders with indexes hidden (where a digit is silently ignored), and which
# rows a dialog offers varies with feature flags, so a fixed position is not a
# fixed answer. These values remain for the digit-based fallback.
approve = "1"
deny = "@escape"
verified_against = "2.1.241"

[behaviour]
# Tapping a session key also raises its terminal window.
focus_on_tap = true

[timing]
poll_interval = 1.0
heartbeat_interval = 1.0
# Gap between typing text and pressing Enter. Claude Code's TUI reads an Enter
# arriving in the same input batch as a newline rather than a submit.
submit_delay = 0.5

# The dial's action menu, offered when a session is not blocked on a prompt.
# Each entry is either a `builtin` or literal `text` typed into the session.
#
# submit = true presses Enter afterwards, which is what makes a command RUN
# rather than just appear on the prompt. It defaults to true: picking a command
# from a menu means running it, and the dial already asks twice (one press to
# reveal the choices, one to commit).

[[action]]
label = "Focus"
builtin = "focus"          # raise this session's terminal window

[[action]]
label = "Interrupt"
builtin = "interrupt"      # send Escape

[[action]]
label = "/compact"
text = "/compact"

[[action]]
label = "/clear"
text = "/clear"

# Other things worth binding:
#   text = "\u001b[Z"        Shift-Tab, cycles plan / auto-accept mode
#   text = "/cost"
#   builtin = "output"      open a background job's output directory
